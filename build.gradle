plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.seohamin.jastapi'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
}

test {
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
}